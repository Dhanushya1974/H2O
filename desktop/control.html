<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>H2O</title>
  <style>
    :root { --bg: #eef6fc; --surface: #fff; --text: #0f2233; --muted: #5b7085; --accent: #0b7fd6;
      --paused: #c77700; --paused-soft: #fdf0dc; --off: #8a99a8; --border: #d5e2ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1520; --surface: #13212f; --text: #e6f0f8; --muted: #93a7ba; --accent: #4fb0ff;
        --paused: #f0a93b; --paused-soft: #3a2b12; --off: #6b7c8c; --border: #22364a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; user-select: none; }
    .wrap { padding: 18px 18px 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--off);
      border-radius: 16px; padding: 18px; text-align: center; }
    .card[data-state="on"] { border-top-color: var(--accent); }
    .card[data-state="paused"] { border-top-color: var(--paused); }
    .status { margin: 0; font-weight: 600; color: var(--muted); }
    .card[data-state="on"] .status { color: var(--accent); }
    .card[data-state="paused"] .status { color: var(--paused); }
    .count { margin: 4px 0 2px; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card[data-state="off"] .count { color: var(--off); }
    .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

    .toggle { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; }
    .track { width: 64px; height: 36px; border-radius: 999px; background: var(--off); position: relative; transition: background .2s; }
    .thumb { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff;
      transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .toggle input:checked + .track { background: var(--accent); }
    .toggle input:checked + .track .thumb { transform: translateX(28px); }
    .toggle input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
    .toggle-text { font-weight: 700; font-size: 16px; min-width: 150px; text-align: left; }

    .actions { display: grid; gap: 8px; margin-top: 16px; }
    button { font: inherit; cursor: pointer; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text); }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .pause { background: var(--paused-soft); }
    .opts { margin-top: 12px; font-size: 13px; color: var(--muted); }
    .opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card" data-state="off">
      <p class="status" id="status">Reminders are off</p>
      <p class="count" id="count">--:--:--</p>
      <p class="sub" id="sub">&nbsp;</p>
      <label class="toggle">
        <input type="checkbox" id="toggle" role="switch">
        <span class="track"><span class="thumb"></span></span>
        <span class="toggle-text" id="toggleText">Reminders OFF</span>
      </label>
      <div class="actions">
        <button type="button" class="pause" id="pause">⏸ Pause 1 hour (meeting mode)</button>
        <button type="button" class="pause" id="resume" hidden>▶ Resume now</button>
        <button type="button" id="drank">💧 I drank water, restart the timer</button>
        <button type="button" id="preview">👀 Show the reminder now</button>
      </div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="login"> Start H2O when Windows starts</label>
    </div>
    <p class="note">Closing this window keeps H2O running. Open it again from the 💧 drop icon near the clock.</p>
  </div>
  <script src="control.js"></script>
</body>
</html>
